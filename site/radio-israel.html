<style>
  :root{
    --metal-dark:#1c1c1f;
    --metal:#2c2c31;
    --metal-light:#48484f;
    --chrome-hi:#e7e7ea;
    --chrome-lo:#7a7a82;
    --wood-1:#4a2c18;
    --wood-2:#26140a;
    --vfd-bg:#150d04;
    --vfd-amber:#ffb040;
    --vfd-amber-dim:#8a5a1e;
    --led-red:#e6392c;
    --text:#e9e6df;
    --text-dim:#9a978f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Heebo',sans-serif;
    color:var(--text);
    background:
      radial-gradient(120% 100% at 50% 0%, #333338 0%, #131315 70%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(14px,3vw,32px);
    overflow-x:hidden;
  }
  .vfd-font{font-family:'VT323',monospace;}

  /* ===== Unit shell ===== */
  .unit{
    width:100%;
    max-width:980px;
    background:linear-gradient(180deg,var(--metal-light),var(--metal) 12%, var(--metal-dark) 100%);
    border-radius:14px;
    box-shadow:
      0 20px 40px -12px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -2px 0 rgba(0,0,0,.5);
    padding:14px;
  }
  .wood-strip{
    height:12px;
    border-radius:6px;
    background:linear-gradient(180deg,var(--wood-1),var(--wood-2));
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15), inset 0 -1px 2px rgba(0,0,0,.6);
    margin-bottom:12px;
  }

  /* ===== Header / brand ===== */
  .head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 8px 12px;
  }
  .brand{
    font-weight:900;
    font-size:clamp(16px,2.2vw,22px);
    letter-spacing:2px;
    color:var(--chrome-hi);
    text-shadow:0 1px 0 rgba(0,0,0,.6);
  }
  .power-led{
    display:inline-block;
    width:8px;height:8px;border-radius:50%;
    background:#3a1210;
    box-shadow:inset 0 0 2px rgba(0,0,0,.8);
    margin-left:8px;
    vertical-align:middle;
  }
  .power-led.on{
    background:var(--led-red);
    box-shadow:0 0 6px 2px rgba(230,57,44,.8), inset 0 0 2px rgba(0,0,0,.4);
  }
  #clock{
    font-size:22px;
    color:var(--vfd-amber);
    text-shadow:0 0 6px rgba(255,176,64,.7);
  }

  /* ===== Tuning dial ===== */
  .dial-wrap{
    background:var(--vfd-bg);
    border-radius:6px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.8), inset 0 0 0 1px #000;
    padding:10px 14px 6px;
    margin:0 8px 12px;
  }
  .dial{
    position:relative;
    height:34px;
  }
  .dial-tick{
    position:absolute;
    bottom:0;
    transform:translateX(50%);
    font-size:12px;
    color:var(--vfd-amber-dim);
    padding-bottom:4px;
    border-right:1px solid var(--vfd-amber-dim);
    padding-right:5px;
    height:12px;
  }
  .dial-needle{
    position:absolute;
    bottom:-2px;
    width:2px;
    height:34px;
    background:var(--led-red);
    box-shadow:0 0 8px 1px rgba(230,57,44,.9);
    transition:right 400ms cubic-bezier(.4,0,.2,1);
  }

  /* ===== VFD now-playing display ===== */
  .vfd{
    background:var(--vfd-bg);
    border-radius:6px;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.85), inset 0 0 0 1px #000;
    margin:0 8px 14px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    min-height:56px;
  }
  .vfd-text{
    min-width:0;
    flex:1;
  }
  .vfd-name{
    font-size:clamp(18px,2.6vw,26px);
    font-weight:700;
    color:var(--vfd-amber);
    text-shadow:0 0 8px rgba(255,176,64,.65);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .vfd-song{
    font-size:13px;
    color:var(--vfd-amber-dim);
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-height:16px;
  }
  .vfd-status{
    font-size:13px;
    color:var(--vfd-amber-dim);
    white-space:nowrap;
  }

  /* ===== Transport controls ===== */
  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:6px 8px 18px;
    flex-wrap:wrap;
  }
  .btn-transport{
    width:64px;height:64px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-size:22px;
    color:var(--chrome-hi);
    background:linear-gradient(180deg,#5a5a62,#38383e);
    box-shadow:
      0 3px 0 #17171a,
      0 6px 10px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
    transition:transform 80ms;
  }
  .btn-transport:active, .btn-transport.pressed{
    transform:translateY(3px);
    box-shadow:0 0 0 #17171a, inset 0 2px 6px rgba(0,0,0,.6);
  }
  .transport-label{
    font-size:10px;
    color:var(--text-dim);
    text-align:center;
    margin-top:6px;
    letter-spacing:1px;
  }
  .rights-note{
    margin:18px 4px 4px;
    font-size:11px;
    line-height:1.5;
    color:var(--text-dim);
    text-align:center;
  }
  .transport-col{ display:flex; flex-direction:column; align-items:center; }

  .knob-wrap{ display:flex; flex-direction:column; align-items:center; }
  .knob-row{ display:flex; align-items:center; gap:8px; }
  .vol-btn{
    width:30px;height:30px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    color:var(--chrome-hi);
    background:linear-gradient(180deg,#54545c,#34343a);
    box-shadow:0 2px 0 #17171a, inset 0 1px 0 rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .vol-btn:active{ transform:translateY(2px); box-shadow:0 0 0 #17171a, inset 0 2px 4px rgba(0,0,0,.5); }

  /* ===== Tabs ===== */
  .tabs{
    display:flex;
    gap:6px;
    margin:0 8px 10px;
  }
  .tab-btn{
    flex:1;
    padding:8px 10px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-family:'Heebo',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--metal-dark);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
  }
  .tab-btn.active{
    color:var(--vfd-amber);
    background:linear-gradient(180deg,#3a2f1c,#241c10);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6), inset 0 0 0 1px var(--vfd-amber-dim);
  }

  /* Hidden tab: invisible in its place until opened with 3 quick taps. */
  .tab-btn.secret{ cursor:default; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  .tab-btn.secret:not(.active){ opacity:0; }

  /* ===== Favorite star ===== */
  .star-btn{
    position:absolute;
    top:4px;right:4px;
    border:none;background:none;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    opacity:.5;
  }
  .star-btn.active{ color:var(--vfd-amber); opacity:1; text-shadow:0 0 5px rgba(255,176,64,.7); }
  .star-btn:hover{ opacity:1; }

  /* ===== Drag and drop ===== */
  .preset[draggable="true"]{ cursor:grab; }
  .preset.dragging{ opacity:.35; }
  .preset.drag-over{ box-shadow:0 2px 0 #141416, inset 0 0 0 2px var(--vfd-amber); }


  .knob{
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #7a7a82, #2e2e33 70%);
    box-shadow:0 3px 0 #17171a, 0 6px 10px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.3);
    position:relative;
    cursor:pointer;
  }
  .knob::after{
    content:'';
    position:absolute;
    top:6px;left:50%;
    width:3px;height:16px;
    background:var(--chrome-hi);
    border-radius:2px;
    transform-origin:50% 22px;
    transform:translateX(-50%) rotate(var(--rot,-120deg));
    box-shadow:0 0 3px rgba(0,0,0,.6);
  }

  /* ===== Preset bank ===== */
  .presets{
    background:var(--metal-dark);
    border-radius:8px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
    padding:12px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:8px;
    max-height:52vh;
    overflow-y:auto;
  }
  .preset{
    position:relative;
    background:linear-gradient(180deg,#4a4a51,#303035);
    border-radius:7px;
    padding:9px 10px 8px;
    cursor:pointer;
    box-shadow:0 2px 0 #141416, inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform 80ms;
    outline:none;
  }
  .preset:hover{ background:linear-gradient(180deg,#54545c,#38383e); }
  .preset:active{ transform:translateY(2px); box-shadow:0 0 0 #141416, inset 0 2px 4px rgba(0,0,0,.5); }
  .preset.playing{
    background:linear-gradient(180deg,#3a2f1c,#241c10);
    box-shadow:0 2px 0 #141416, 0 0 0 1px var(--vfd-amber-dim), inset 0 2px 4px rgba(0,0,0,.5);

  .preset.empty{ opacity:.45; }
  .preset-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .preset-num{
    font-size:11px;
    color:var(--text-dim);
    background:#1a1a1c;
    border-radius:3px;
    padding:1px 5px;
  }
  .preset-led{
    width:6px;height:6px;border-radius:50%;
    background:#3a1210;
  }
  .preset.playing .preset-led{
    background:var(--vfd-amber);
    box-shadow:0 0 5px 2px rgba(255,176,64,.8);
  }
  .preset-name{
    font-size:13px;
    font-weight:700;
    line-height:1.25;
    color:var(--text);
  }
  .preset.playing .preset-name{ color:var(--vfd-amber); }
  .edit-btn{
    position:absolute;
    top:4px;left:4px;
    border:none;background:none;
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    opacity:0;
    transition:opacity 120ms;
  }
  .preset:hover .edit-btn{ opacity:.8; }
  .edit-btn:hover{ color:var(--vfd-amber); }

  .edit-row{
    margin-top:6px;
    display:flex;
    gap:4px;
  }
  .edit-row input{
    flex:1;min-width:0;
    background:#0f0f10;
    border:1px solid #000;
    border-radius:3px;
    color:var(--text);
    font-size:10px;
    padding:5px 6px;
  }
  .edit-row button{
    border:1px solid var(--vfd-amber-dim);
    background:transparent;
    color:var(--vfd-amber);
    border-radius:3px;
    font-size:10px;
    padding:0 8px;
    cursor:pointer;
  }
  .edit-status{ font-size:10px; margin-top:3px; }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#111;border-radius:4px;}

  @media (max-width:520px){
    .transport{ gap:14px; }
    .btn-transport{ width:54px;height:54px;font-size:18px; }
  }
</style>
</head>

</div>

function loadStations(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      // merge: keep any user edits, but adopt new stations from RAW_STATIONS if list shape changed
      if(Array.isArray(saved) && saved.length === RAW_STATIONS.length){
        return saved.map(s => ({favorite:false, ...s}));
      }
    }
  }catch(e){}
  return RAW_STATIONS.map(s=>({...s, url:s.streamUrl||'', favorite:false}));
}
function saveStations(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
}

/* ===== Static noise on station change ===== */
function playStaticNoise(duration=350){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const size = Math.floor(ctx.sampleRate*(duration/1000));
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i] = (Math.random()*2-1)*0.6;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration/1000);
    src.connect(gain).connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + duration/1000);
    src.onended = ()=>{ try{ ctx.close(); }catch(e){} };
  }catch(e){ /* AudioContext unavailable; skip silently */ }
}

// If running inside the Electron shell (window.electronAPI is injected by preload.js),
// route raw fetches through the Node main process — no browser CORS restrictions apply there.
// Falls back to a normal browser fetch when running as a plain web page.
async function smartFetchText(url){
  if(window.electronAPI && window.electronAPI.fetchRaw){
    try{
      const r = await window.electronAPI.fetchRaw(url);
      return r && r.ok ? r.text : null;
    }catch(e){ return null; }
  }
  try{
    const res = await fetch(url, {cache:'no-store'});
    return res.ok ? await res.text() : null;
  }catch(e){ return null; }
}

function parseGlzXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) return null;
    const songs = Array.from(doc.getElementsByTagName('Song'));
    if(songs.length === 0) return null;
    // prefer a node whose status hints at "now playing"; else take the first one
    let node = songs.find(s => /play|now|current|on.?air/i.test(s.getAttribute('status')||'')
                              || /play|now|current|on.?air/i.test((s.parentElement && s.parentElement.getAttribute('status'))||''));
    if(!node) node = songs[0];
    const title = node.getAttribute('title') || node.querySelector('title')?.textContent || '';
    const artistNode = node.querySelector('Artist, artist');
    const artist = (artistNode && (artistNode.getAttribute('name') || artistNode.textContent)) || '';
    const label = [artist, title].filter(Boolean).join(' – ');
    return label || null;
  }catch(e){ return null; }
}

function parseKanApi(json){
  try{
    const candidates = [
      json, json.data, json.result, json.track, json.data?.track, json.liveTrack, json.data?.liveTrack
    ].filter(Boolean);
    for(const c of candidates){
      const artist = c.artist || c.artistName || c.performer || c.singer;
      const title = c.title || c.songName || c.trackName || c.name;
      if(artist || title){
        return [artist, title].filter(Boolean).join(' – ');
      }
    }
  }catch(e){}
  return null;
}

function parseTritonXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.querySelector('parsererror')) return null;
    const props = Array.from(doc.getElementsByTagName('property'));
    if(props.length === 0) return null;
    const map = {};
    props.forEach(p=>{ map[(p.getAttribute('name')||'').toLowerCase()] = p.textContent||''; });
    const artistKey = Object.keys(map).find(k=>k.includes('artist'));
    const titleKey = Object.keys(map).find(k=>k.includes('title') && !k.includes('artist'));
    const artist = artistKey ? map[artistKey] : '';
    const title = titleKey ? map[titleKey] : '';
    const label = [artist, title].filter(Boolean).join(' – ');
    return label || null;
  }catch(e){ return null; }
}

function decodeHtmlEntities(str){
  const ta = document.createElement('textarea');
  ta.innerHTML = str;
  return ta.value;
}

async function fetchGlzPageNowPlaying(pageUrl){
  // Electron: scrape via a real hidden browser window that executes the page's JS
  if(window.electronAPI && window.electronAPI.scrapeGlz){
    try{
      const val = await window.electronAPI.scrapeGlz(pageUrl);
      if(val) return decodeHtmlEntities(val);
    }catch(e){ /* fall through */ }
  }

  // Browser fallback (does not execute the page's JS, so this rarely finds anything —
  // kept only so the app still tries something when run as a plain web page)
  try{
    const res = await fetch('https://r.jina.ai/' + pageUrl, {cache:'no-store'});
    if(res.ok){
      const text = await res.text();
      const m = text.match(/חי\s+([^\n]+?)\s*\n+\s*התוכנית הבאה/);
      if(m && m[1]) return m[1].trim();
    }
  }catch(e){ /* fall through */ }
  try{
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(pageUrl);
    const res = await fetch(proxied, {cache:'no-store'});
    if(res.ok){
      const html = await res.text();
      const m = html.match(/data-live-fallback="([^"]*)"/);
      if(m && m[1]) return decodeHtmlEntities(m[1]);
    }
  }catch(e){ /* give up quietly */ }

  return null;
}

async function fetchIcyNowPlaying(streamUrl){
  // Electron: read ICY metadata in the Node main process — full access to icy-metaint,
  // which most public Icecast servers don't expose to browser JS even with CORS enabled.
  if(window.electronAPI && window.electronAPI.icyTitle){
    try{ return await window.electronAPI.icyTitle(streamUrl); }
    catch(e){ /* fall through to browser attempt */ }
  }
  try{
    const res = await fetch(streamUrl, {cache:'no-store'});
    const metaInt = parseInt(res.headers.get('icy-metaint'), 10);
    if(!metaInt || !res.body) return null;
    const reader = res.body.getReader();
    let buffer = new Uint8Array(0);
    let totalRead = 0;
    while(totalRead < 600000){ // safety cap ~600KB
      const {done, value} = await reader.read();
      if(done) break;
      const merged = new Uint8Array(buffer.length + value.length);
      merged.set(buffer); merged.set(value, buffer.length);
      buffer = merged;
      totalRead += value.length;
      if(buffer.length > metaInt){
        const metaLen = buffer[metaInt] * 16;
        if(metaLen === 0){ reader.cancel(); return null; }
        if(buffer.length >= metaInt + 1 + metaLen){
          const metaBytes = buffer.slice(metaInt + 1, metaInt + 1 + metaLen);
          const metaStr = new TextDecoder('utf-8').decode(metaBytes).replace(/\0+$/, '');
          reader.cancel();
          const m = metaStr.match(/StreamTitle='([^']*)'/);
          return (m && m[1]) ? m[1] : null;
        }
      }
    }
    reader.cancel();
    return null;
  }catch(e){
    return null; // likely CORS block or server doesn't send icy-metaint
  }
}

async function fetchNowPlaying(station){
  if(!station.nowPlaying) { vfdSong.textContent = ''; return; }
  const np = station.nowPlaying;

  if(np.method === 'glzpage'){
    const label = await fetchGlzPageNowPlaying(np.pageUrl);
    vfdSong.textContent = label || '';
    return;
  }
  if(np.method === 'icy'){
    const label = await fetchIcyNowPlaying(station.url);
    vfdSong.textContent = label || '';
    return;
  }

  const url = np.method === 'triton'
    ? `https://np.tritondigital.com/public/nowplaying?mountName=${np.mount}&numberToFetch=1&eventType=track`
    : np.url;
  if(!url){ vfdSong.textContent = ''; return; }
  const text = await smartFetchText(url);
  if(!text){ vfdSong.textContent = ''; return; }
  let label = null;
  try{
    if(np.method === 'xml'){
      label = parseGlzXml(text);
    } else if(np.method === 'api'){
      label = parseKanApi(JSON.parse(text));
    } else if(np.method === 'triton'){
      label = parseTritonXml(text);
    }
  }catch(e){ label = null; }
  vfdSong.textContent = label || '';
}

function startNowPlaying(station){
  clearNowPlaying();

  fetchNowPlaying(station);
  nowPlayingTimer = setInterval(()=> fetchNowPlaying(station), 25000);

// Content items must play an episode, never a station's live stream.
const LIVE_AUDIO_RE = /icecast|livestream|live-redirect|\/live(hls)?\/|\.livx|streamtheworld|glzwizzlv|\/live[_-]|_(mp3|aac)$|\/stream\/[^\/.]*\/?$/i;
function isLiveAudio(url){
  return LIVE_AUDIO_RE.test(url) || RAW_STATIONS.some(st => st.streamUrl === url);
}

// Newest audio file listed in the page's HTML (100FM lists its episodes as
// .../wp-content/uploads/YYYY/MM/<file>.mp3, newest first).
async function latestAudioFromHtml(pageUrl){
  if(!window.electronAPI || !window.electronAPI.fetchRaw) return null;
  try{
    const r = await window.electronAPI.fetchRaw(pageUrl);
    if(!r || !r.ok || !r.text) return null;
    const html = r.text.replace(/\\\//g, '/');
    const urls = [...new Set(html.match(/https?:\/\/[^"'\s<>()]+?\.(mp3|m4a|aac)(?=["'\s<>?)])/gi) || [])]
      .filter(u => !isLiveAudio(u));
    if(!urls.length) return null;
    const month = u => { const m = u.match(/\/(20\d\d)\/(\d\d)\//); return m ? (+m[1]) * 12 + (+m[2]) : 0; };
    return urls.map((u, i) => ({ u, i, m: month(u) }))
      .sort((a, b) => b.m - a.m || a.i - b.i)[0].u;
  }catch(e){ return null; }
}

// A station's page can link an episode its server no longer has (404).
// fetchRaw stops after 2 MB, so a real audio file comes back as "too large" (status 0).
async function audioExists(url){
  if(!window.electronAPI || !window.electronAPI.fetchRaw) return true;
  try{
    const r = await window.electronAPI.fetchRaw(url);
    return !(r && r.status >= 400);
  }catch(e){ return true; }
}

// Finds the item's episode; skips live streams and episodes that no longer exist.
// Each search of the page can land on a different episode, so try a few times.
async function resolveContentAudio(item){
  const tried = new Set();
  let live = false;
  for(let attempt = 0; attempt < 3; attempt++){
    let url = (attempt === 0 && item.latestFromHtml) ? await latestAudioFromHtml(item.pageUrl) : null;
    if(!url) url = await window.electronAPI.scrapePageAudio(item.pageUrl);
    if(!url) break;
    if(isLiveAudio(url)){ live = true; continue; }
    if(tried.has(url)) continue;
    tried.add(url);
    if(await audioExists(url)) return { url };
    if(lastContentItem === item) setStatus('הפרק האחרון לא זמין באתר התחנה — מחפש פרק אחר...');
  }
  if(tried.size) return { missing: true };
  return live ? { live: true } : {};
}

async function playContentItem(item, tile){
  if(!window.electronAPI || !window.electronAPI.scrapePageAudio){
    setStatus('תוכן נבחר זמין רק באפליקציה (Windows / Android).');
    return;
  }
  lastContentItem = item;
  if(hls){ hls.destroy(); hls = null; }
  clearNowPlaying();
  currentIndex = -1;
  vfdName.textContent = item.name;
  vfdSong.textContent = '';
  setStatus('מאתר קובץ שמע...');
  playStaticNoise(350);

  const found = await resolveContentAudio(item);
  if(lastContentItem !== item || currentIndex !== -1) return; // something else was chosen meanwhile
  if(found.missing){
    setStatus('הפרק לא זמין כרגע באתר התחנה — נסו שוב מאוחר יותר.');
    return;
  }
  if(found.live){
    setStatus('נמצא רק השידור החי של התחנה — הפרק לא זמין כרגע.');
    return;
  }
  const audioUrl = found.url;
  if(!audioUrl){
    setStatus('לא נמצא קובץ שמע בעמוד הזה.');
    return;
  }
  player.src = audioUrl;
  player.volume = volume;
  player.play().then(()=>{
    setStatus('מתנגן: ' + item.name);
  }).catch(()=>{
    setStatus('נמצאה כתובת אך הניגון נכשל.');
  });
}

function selectStation(i){
  const st = stations[i];
  if(!st.url){ setStatus('אין כתובת שידור — לחצו על ✎ כדי להוסיף.'); return; }

  playStaticNoise(350);
  if(hls){ hls.destroy(); hls=null; }

  currentIndex = i;
  vfdName.textContent = st.name;
  moveNeedleByIndex(i, stations.length);
  setStatus('מתכוונן...');
  startNowPlaying(st);
  render();

  setTimeout(()=>{
    const isHls = st.format==='hls' || /\.m3u8($|\?)/i.test(st.url);
    if(isHls && window.Hls && Hls.isSupported()){
      hls = new Hls();
      hls.loadSource(st.url);
      hls.attachMedia(player);
      hls.on(Hls.Events.ERROR,(ev,d)=>{ if(d.fatal) setStatus('שגיאת שידור — נסו תחנה אחרת.'); });
    } else {
      player.src = st.url;
    }
    player.volume = volume;
    player.play().then(()=>{
      setStatus('מתנגן');
    }).catch(()=>{
      setStatus('לא ניתן להפעיל שידור זה בדפדפן.');
    });
  }, 220);
}

playBtn.addEventListener('click',()=>{
  if(currentIndex===-1 && lastContentItem){ playContentItem(lastContentItem); return; }
  if(currentIndex===-1 && !player.src){ setStatus('בחרו תחנה מהרשימה.'); return; }
  player.play().catch(()=>{});
});
stopBtn.addEventListener('click',()=>{
  player.pause();
  player.currentTime = 0;
  if(hls){ hls.stopLoad(); }
  clearNowPlaying();
  setStatus('נעצר');
});

player.addEventListener('playing',()=> setStatus('מתנגן'));
player.addEventListener('pause',()=>{ if(vfdStatus.textContent==='מתנגן') setStatus('מושהה'); });

/* ===== Volume knob ===== */
let knobDragging=false, knobStartY=0, knobStartVol=0;
function applyVolume(v){
  volume = Math.min(1, Math.max(0, v));
  player.volume = volume;
  volKnob.style.setProperty('--rot', (-120 + volume*240) + 'deg');
}
volKnob.addEventListener('pointerdown',(e)=>{
  knobDragging=true; knobStartY=e.clientY; knobStartVol=volume;
  volKnob.setPointerCapture(e.pointerId);
});
volKnob.addEventListener('pointermove',(e)=>{
  if(!knobDragging) return;
  const dy = knobStartY - e.clientY;
  applyVolume(knobStartVol + dy/150);
});
volKnob.addEventListener('pointerup',()=> knobDragging=false);
volUp.addEventListener('click', ()=> applyVolume(volume + 0.07));
volDown.addEventListener('click', ()=> applyVolume(volume - 0.07));
applyVolume(volume);

/* ===== Clock ===== */
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL');
}
setInterval(tickClock,1000);
tickClock();

renderDial();
render();
</script>
