<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #root .lay { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #root .lay img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="a8" data-start="0" data-duration="2.4" data-width="1080" data-height="1920">
    <div id="a8-world" class="lay">
      <div id="a8-bg" class="lay"><img src="assets/layers/8_bg.jpg" alt="" /></div>
      <div id="a8-p0" class="lay"><img src="assets/layers/8_p0.png" alt="" /></div>
      <div id="a8-hero" class="lay"><div id="a8-heroin" class="lay">
      <div id="a8-armA" class="lay"><img src="assets/layers/8_armA.png" alt="" /></div>
          <div id="a8-body" class="lay"><img src="assets/layers/8_hero.png" alt="" /></div>
      <div id="a8-armB" class="lay"><img src="assets/layers/8_armB.png" alt="" /></div>
      </div></div>
    </div>
  </div>
  <script>
    const D = 2.4;

    const tl = gsap.timeline({ paused: true });
    function rng(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    // up-down bob, two footfalls per stride
    function bob(sel, t0, t1, amp, period) {
      for (let t = t0; t < t1 - 0.001; t += period / 2) {
        tl.to(sel, { y: -amp, duration: period / 4, ease: "sine.out" }, t);
        tl.to(sel, { y: 0, duration: period / 4, ease: "sine.in" }, t + period / 4);
      }
    }
    // alternating rotation around an origin (arm swing, body sway)
    function swing(sel, origin, t0, t1, deg, period, phase = 1) {
      let i = 0;
      for (let t = t0; t < t1 - 0.001; t += period / 2, i++) {
        tl.to(sel, { rotation: (i % 2 ? 1 : -1) * deg * phase, transformOrigin: origin, duration: period / 2, ease: "sine.inOut" }, t);
      }
    }
    // seeded nervous jitter
    function jitter(sel, t0, t1, amp, seed, rot = 0) {
      const r = rng(seed);
      for (let t = t0; t < t1 - 0.001; t += 1 / 15) {
        tl.to(sel, { x: (r() - 0.5) * amp, y: (r() - 0.5) * amp, rotation: (r() - 0.5) * rot, duration: 1 / 15, ease: "sine.inOut" }, t);
      }
      tl.to(sel, { x: 0, y: 0, rotation: 0, duration: 0.1 }, t1 - 0.1);
    }


    tl.fromTo("#a8-world", { scale: 1.04, transformOrigin: "50% 40%" }, { scale: 1.12, duration: D, ease: "power1.inOut" }, 0);
    tl.fromTo("#a8-hero", { scale: 1.0, transformOrigin: "393px 1672px" }, { scale: 1.2, duration: D, ease: "power1.in" }, 0);
    bob("#a8-heroin", 0, D, 20, 0.4);
    swing("#a8-heroin", "393px 1672px", 0, D, 2.2, 0.4);
    swing("#a8-armA img", "220px 750px", 0, D, 16, 0.4);
    swing("#a8-armB img", "580px 770px", 0, D, 14, 0.4, -1);
    bob("#a8-p0", 0, D, 6, 1.0);
    swing("#a8-p0", "802px 1430px", 0, D, 1.5, 1.0);
    
    window.__timelines["a8"] = tl;
  </script>
