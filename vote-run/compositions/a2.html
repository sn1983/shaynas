<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #root .lay { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #root .lay img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="a2" data-start="0" data-duration="3.2" data-width="1080" data-height="1920">
    <div id="a2-world" class="lay">
      <div id="a2-bg" class="lay"><img src="assets/layers/2_bg.jpg" alt="" /></div>
      <div id="a2-p0" class="lay"><img src="assets/layers/2_p0.png" alt="" /></div>
      <div id="a2-hero" class="lay"><div id="a2-heroin" class="lay">
      <div id="a2-armR" class="lay"><img src="assets/layers/2_armR.png" alt="" /></div>
          <div id="a2-body" class="lay"><img src="assets/layers/2_hero.png" alt="" /></div>
      <div id="a2-armL" class="lay"><img src="assets/layers/2_armL.png" alt="" /></div>
      </div></div>
    </div>
  </div>
  <script>
    const D = 3.2;

    const tl = gsap.timeline({ paused: true });
    function rng(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    // up-down bob, two footfalls per stride
    function bob(sel, t0, t1, amp, period) {
      for (let t = t0; t < t1 - 0.001; t += period / 2) {
        tl.to(sel, { y: -amp, duration: period / 4, ease: "sine.out" }, t);
        tl.to(sel, { y: 0, duration: period / 4, ease: "sine.in" }, t + period / 4);
      }
    }
    // alternating rotation around an origin (arm swing, body sway)
    function swing(sel, origin, t0, t1, deg, period, phase = 1) {
      let i = 0;
      for (let t = t0; t < t1 - 0.001; t += period / 2, i++) {
        tl.to(sel, { rotation: (i % 2 ? 1 : -1) * deg * phase, transformOrigin: origin, duration: period / 2, ease: "sine.inOut" }, t);
      }
    }
    // seeded nervous jitter
    function jitter(sel, t0, t1, amp, seed, rot = 0) {
      const r = rng(seed);
      for (let t = t0; t < t1 - 0.001; t += 1 / 15) {
        tl.to(sel, { x: (r() - 0.5) * amp, y: (r() - 0.5) * amp, rotation: (r() - 0.5) * rot, duration: 1 / 15, ease: "sine.inOut" }, t);
      }
      tl.to(sel, { x: 0, y: 0, rotation: 0, duration: 0.1 }, t1 - 0.1);
    }


    tl.fromTo("#a2-bg", { scale: 1.1, transformOrigin: "50% 45%" }, { scale: 1.02, duration: D, ease: "none" }, 0);
    tl.fromTo("#a2-hero", { scale: 1.02, y: 0, transformOrigin: "426px 1673px" }, { scale: 1.3, y: 90, duration: D, ease: "power1.in" }, 0);
    bob("#a2-heroin", 0, D, 22, 0.4);
    swing("#a2-heroin", "426px 1673px", 0, D, 2.4, 0.4);
    swing("#a2-armR img", "230px 590px", 0, D, 20, 0.4);
    swing("#a2-armL img", "660px 670px", 0, D, 16, 0.4, -1);
    tl.fromTo("#a2-p0", { y: 0, rotation: 0, transformOrigin: "886px 1589px" }, { y: -26, rotation: 6, duration: 0.3, ease: "power3.out" }, 0.55);
    tl.to("#a2-p0", { y: 0, duration: 0.3, ease: "bounce.out" }, 0.85);
    tl.to("#a2-p0", { rotation: 3, duration: D - 1.15, ease: "sine.inOut" }, 1.15);
    
    window.__timelines["a2"] = tl;
  </script>
</template>
