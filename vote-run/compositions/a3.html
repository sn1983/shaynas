<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #root .lay { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #root .lay img { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="a3" data-start="0" data-duration="2.4" data-width="1080" data-height="1920">
    <div id="a3-world" class="lay">
      <div id="a3-bg" class="lay"><img src="assets/layers/3_bg.jpg" alt="" /></div>
      <div id="a3-p0" class="lay"><img src="assets/layers/3_p0.png" alt="" /></div>
      <div id="a3-hero" class="lay"><div id="a3-heroin" class="lay">
      <div id="a3-armA" class="lay"><img src="assets/layers/3_armA.png" alt="" /></div>
          <div id="a3-body" class="lay"><img src="assets/layers/3_hero.png" alt="" /></div>
      <div id="a3-armB" class="lay"><img src="assets/layers/3_armB.png" alt="" /></div>
      </div></div>
      <div id="a3-orange" class="lay"><img src="assets/layers/3_orange.png" alt="" /></div>
      <div id="a3-apple" class="lay"><img src="assets/layers/3_apple.png" alt="" /></div>
    </div>
  </div>
  <script>
    const D = 2.4;

    const tl = gsap.timeline({ paused: true });
    function rng(seed) { let a = seed; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    // up-down bob, two footfalls per stride
    function bob(sel, t0, t1, amp, period) {
      for (let t = t0; t < t1 - 0.001; t += period / 2) {
        tl.to(sel, { y: -amp, duration: period / 4, ease: "sine.out" }, t);
        tl.to(sel, { y: 0, duration: period / 4, ease: "sine.in" }, t + period / 4);
      }
    }
    // alternating rotation around an origin (arm swing, body sway)
    function swing(sel, origin, t0, t1, deg, period, phase = 1) {
      let i = 0;
      for (let t = t0; t < t1 - 0.001; t += period / 2, i++) {
        tl.to(sel, { rotation: (i % 2 ? 1 : -1) * deg * phase, transformOrigin: origin, duration: period / 2, ease: "sine.inOut" }, t);
      }
    }
    // seeded nervous jitter
    function jitter(sel, t0, t1, amp, seed, rot = 0) {
      const r = rng(seed);
      for (let t = t0; t < t1 - 0.001; t += 1 / 15) {
        tl.to(sel, { x: (r() - 0.5) * amp, y: (r() - 0.5) * amp, rotation: (r() - 0.5) * rot, duration: 1 / 15, ease: "sine.inOut" }, t);
      }
      tl.to(sel, { x: 0, y: 0, rotation: 0, duration: 0.1 }, t1 - 0.1);
    }


    tl.fromTo("#a3-world", { scale: 1.08, y: 60, transformOrigin: "50% 50%" }, { scale: 1.12, y: -30, duration: D, ease: "power1.out" }, 0);
    // the hurdle: rise to the top of the arc, then start to come down
    tl.fromTo("#a3-hero", { y: 18, rotation: -1.5, transformOrigin: "444px 575px" }, { y: -22, rotation: 0.5, duration: 1.2, ease: "power2.out" }, 0);
    tl.to("#a3-hero", { y: 4, rotation: 1.5, duration: D - 1.2, ease: "power2.in" }, 1.2);
    swing("#a3-armA img", "300px 350px", 0, D, 6, 0.8);
    swing("#a3-armB img", "700px 460px", 0, D, 12, 0.8, -1);
    // the shopkeeper flinches back, hands shaking
    tl.fromTo("#a3-p0", { rotation: 0, transformOrigin: "860px 1853px" }, { rotation: 1.5, duration: 0.25, ease: "power3.out" }, 0.2);
    jitter("#a3-p0 img", 0.2, D, 4, 31, 1);
    // fruit flies off the crates
    tl.fromTo("#a3-apple", { y: 0, rotation: 0, transformOrigin: "546px 1210px" }, { y: -140, rotation: 90, duration: 0.6, ease: "power2.out" }, 0.3);
    tl.to("#a3-apple", { y: 420, rotation: 260, duration: 0.9, ease: "power2.in" }, 0.9);
    tl.fromTo("#a3-orange", { y: 0, x: 0, rotation: 0, transformOrigin: "792px 1592px" }, { y: 320, x: 60, rotation: 300, duration: 1.2, ease: "power2.in" }, 0.5);
    
    window.__timelines["a3"] = tl;
  </script>
</template>
