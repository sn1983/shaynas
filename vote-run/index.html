<!doctype html>
<html lang="he" data-resolution="portrait" data-composition-variables='[{"id":"openTitle","type":"string","label":"Opening chip","default":"יום הבחירות"},{"id":"cta","type":"string","label":"Call to action","default":"צאו להצביע!"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #cfe6f5; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="film" data-composition-id="film" data-composition-src="compositions/film.html" data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="titles" data-composition-id="titles" data-composition-src="compositions/titles.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="30" data-track-index="3" data-volume="0.8"></audio>
      <audio id="vo" class="clip" src="assets/audio/vo_take1.mp3" data-start="26.7" data-duration="2.85" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
