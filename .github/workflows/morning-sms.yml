name: Morning SMS

on:
  schedule:
    # Cron in GitHub Actions is always UTC, and Israel switches between UTC+2
    # and UTC+3. Both times below are 07:00 local for one half of the year, and
    # src/schedule.js lets only the run that is really 07:00 locally send.
    - cron: '0 4 * * *' # 07:00 Israel time during DST (Apr-Oct)
    - cron: '0 5 * * *' # 07:00 Israel time during standard time (Oct-Apr)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the messages instead of sending them'
        type: boolean
        default: true
      force:
        description: 'Send regardless of the current local time'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send the morning messages
        env:
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER || 'twilio' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          INFORU_USERNAME: ${{ secrets.INFORU_USERNAME }}
          INFORU_TOKEN: ${{ secrets.INFORU_TOKEN }}
          INFORU_SENDER: ${{ secrets.INFORU_SENDER }}
          SMS4FREE_KEY: ${{ secrets.SMS4FREE_KEY }}
          SMS4FREE_USER: ${{ secrets.SMS4FREE_USER }}
          SMS4FREE_PASS: ${{ secrets.SMS4FREE_PASS }}
          SMS4FREE_SENDER: ${{ secrets.SMS4FREE_SENDER }}
        run: |
          node src/send.js \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
