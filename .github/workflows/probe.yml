name: Probe streams (temporary)
on:
  push:
    branches: [claude/electron-shay-radio-app-8klop2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          O='Origin: https://shay-radio-il.netlify.app'
          for u in \
            http://eco01.mediacast.co.il/ecolive/99fm_aac/icecast.audio \
            https://eco01.mediacast.co.il/ecolive/99fm_aac/icecast.audio \
            https://cdn88.mediacast.co.il/102-tlv-live/102fm_aac/icecast.audio \
            https://radio.streamgates.net/stream/101fm \
            https://cdn.cybercdn.live/103FM/Live/icecast.audio \
            http://www.rs.mizrahit.fm:7777/ ; do
            echo "=================== $u"
            curl -sS -m 6 -D - -o body.bin -H "$O" -H 'Range: bytes=0-' "$u" | grep -iE '^(HTTP|content-type|access-control|location|icy-|server)'
            echo "bytes: $(wc -c < body.bin)"; head -c 4 body.bin | xxd | head -1
          done
