name: Probe site (temporary)
on:
  push:
    branches: [claude/electron-shay-radio-app-8klop2]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL https://shay-radio-il.netlify.app/ -o index.html
          echo "=== body + script"
          sed -n '/<body/,$p' index.html | grep -v '^\s*$' | cut -c1-220
          echo "=== eco99 https check"
          curl -sS -m 8 -o /dev/null -w '%{http_code} %{content_type}\n' -r 0-1000 https://eco01.mediacast.co.il/ecolive/99fm_aac/icecast.audio
          curl -sS -m 8 -o /dev/null -w '%{http_code} %{content_type}\n' -r 0-1000 https://www.rs.mizrahit.fm:7777/
