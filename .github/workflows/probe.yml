name: Probe station now-playing sources (temporary)
on:
  push:
    branches: [claude/electron-shay-radio-app-8klop2]
    paths: [.github/workflows/probe.yml, .github/probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/probe/sniff.js 2>&1 | cut -c1-600
