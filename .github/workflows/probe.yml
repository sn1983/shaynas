name: Verify on-demand items (temporary)
on:
  push:
    branches: [claude/electron-shay-radio-app-8klop2]
    paths: [.github/workflows/probe.yml, .github/probe/**, site/radio-israel.html]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: xvfb-run -a npx electron --no-sandbox .github/probe/verify.js 2>&1 | grep -E '^(OK|FAIL)'
        timeout-minutes: 10
