name: Discover on-demand programs (temporary)
on:
  push:
    branches: [claude/electron-shay-radio-app-8klop2]
    paths: [.github/workflows/probe.yml, .github/probe/**]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: xvfb-run -a npx electron --no-sandbox .github/probe/discover.js 2>&1 | grep -v -iE 'dbus|gpu|viz|vaapi|libva' | cut -c1-700
        timeout-minutes: 35
      - name: Commit the live site HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/radio-israel.live.html
          git commit -m "Snapshot of the live radio-israel.html (temporary)" || echo "no change"
          git push || echo "push failed"
